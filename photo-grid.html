<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photo Grid">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1A1A">
<title>PHOTO GRID</title>
<style>
  :root, body[data-theme="dark"] {
    --bg:#1A1A1A; --card:#252525; --border:#3C3C3C; --text:#F4F1EB; --label:#B9B5AE; --sub:#CFCBC4;
    --accbg:#F4F1EB; --accfg:#1A1A1A; --btn:#2E2E2E; --err:#E59A72; --ok:#7DBF8E; --handle:#D4845A;
  }
  body[data-theme="light"] {
    --bg:#E8E5DF; --card:#FFFFFF; --border:#CFCBC3; --text:#1A1A1A; --label:#6F6B66; --sub:#5F5B56;
    --accbg:#1A1A1A; --accfg:#FFFFFF; --btn:#FFFFFF; --err:#A0522D; --ok:#3F6B4C; --handle:#B85E34;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: Georgia, serif; -webkit-text-size-adjust: 100%; }
  body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; overflow: hidden; overscroll-behavior: none;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body.full { background: #000; }
  #app { height: 100%; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; border-bottom: 1px solid var(--border); flex: none; }
  .title { font: 13px Helvetica, Arial, sans-serif; letter-spacing: .34em; color: var(--label); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 18px 6px; flex: none; }
  .lbl { font: 10px Helvetica, Arial, sans-serif; letter-spacing: .3em; color: var(--label); margin: 0 2px 0 4px; }
  .b { min-height: 44px; padding: 0 13px; background: var(--btn); color: var(--text); border: 1px solid var(--border); border-radius: 0;
       font: 700 11px Helvetica, Arial, sans-serif; letter-spacing: .2em; display: inline-flex; align-items: center; justify-content: center;
       white-space: nowrap; cursor: pointer; -webkit-appearance: none; appearance: none; touch-action: manipulation; }
  .b.pri { background: var(--accbg); color: var(--accfg); border-color: var(--accbg); }
  .b.on { background: var(--accbg); color: var(--accfg); border-color: var(--accbg); }
  .b.err { color: var(--err); }
  .b[disabled] { opacity: .45; }
  .b.sm { padding: 0 6px; font-size: 10px; letter-spacing: .1em; }
  .step { display: inline-flex; align-items: center; border: 1px solid var(--border); background: var(--btn); }
  .step button { width: 44px; height: 44px; background: none; border: 0; color: var(--text); font: 400 20px Georgia, serif; touch-action: manipulation; }
  .step i { min-width: 34px; text-align: center; font: 700 16px "Courier New", monospace; font-style: normal; }
  #status { padding: 2px 18px 8px; font: 13px/17px Georgia, serif; color: var(--sub); height: 44px; overflow: hidden; flex: none; }
  #status.err { color: var(--err); }
  #stage { flex: 1; position: relative; overflow: hidden; min-height: 0; }
  #cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #sbar { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); padding: 6px 8px; white-space: nowrap; }
  #sbar span { font: 700 12px "Courier New", monospace; letter-spacing: .08em; padding: 0 4px; }
  #sbar .b { min-height: 36px; padding: 0 12px; }
  #pop { position: absolute; background: var(--card); border: 1px solid var(--border); padding: 12px; display: flex; gap: 14px; z-index: 5; }
  [hidden] { display: none !important; }
  .pcol { display: flex; flex-direction: column; gap: 6px; }
  .ph { font: 10px Helvetica, Arial, sans-serif; letter-spacing: .3em; color: var(--label); margin-bottom: 2px; min-height: 12px; }
  .apad { display: grid; grid-template-columns: repeat(3, 44px); grid-auto-rows: 44px; gap: 4px; }
  .apad button { border: 1px solid var(--border); background: var(--btn); display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  .apad button:after { content: ""; width: 6px; height: 6px; border: 1px solid var(--label); }
  .apad button.cur { background: var(--accbg); }
  .apad button.cur:after { width: 10px; height: 10px; background: var(--accfg); border: 0; }
  body.phone #pop { position: static; flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; border-width: 1px 0 0; padding: 10px 14px calc(14px + env(safe-area-inset-bottom)); }
  body.phone #pop .b { min-height: 40px; }
  body.phone #pop .ph { display: none; }
  #exp, #sheet { position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 20; background: rgba(0,0,0,.62); display: flex; align-items: center; justify-content: center; padding: 18px; }
  #sheet { align-items: flex-end; padding: 0; }
  #shufopt { position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 20; background: rgba(0,0,0,.62); display: flex; align-items: center; justify-content: center; padding: 18px; }
  #shufopt .card { max-width: 360px; }
  #shufopt label { display: flex; align-items: center; gap: 12px; min-height: 44px; font: 700 12px Helvetica, Arial, sans-serif; letter-spacing: .12em; }
  #shufopt input[type=checkbox] { width: 26px; height: 26px; margin: 0; accent-color: var(--text); }
  #bShuffle { -webkit-touch-callout: none; }
  #sheet .lbl { width: 104px; margin-left: 4px; }
  .card { background: var(--card); border: 1px solid var(--border); padding: 16px; max-width: 560px; width: 100%; max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  #sheet .card { border-width: 1px 0 0; max-width: none; padding-bottom: calc(22px + env(safe-area-inset-bottom)); }
  #expimg { max-width: 100%; max-height: 42vh; object-fit: contain; align-self: center; background: #888; -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row > .b { flex: 1; }
  #loupe { position: fixed; z-index: 40; width: 120px; text-align: center; pointer-events: none; }
  #loupe canvas { display: block; width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--text); background: var(--card); }
  #loupe span { display: block; margin-top: 6px; padding: 4px 6px; border: 1px solid var(--border); font: 700 12px "Courier New", monospace; letter-spacing: .1em; }
  #bgsw { width: 44px; height: 44px; padding: 0; border: 1px solid var(--border); background: var(--btn); border-radius: 0; flex: none; }
  .nm { flex: 1; min-height: 44px; background: var(--btn); color: var(--text); border: 1px solid var(--border); border-radius: 0; padding: 0 10px; font: 16px "Courier New", monospace; -webkit-user-select: text; user-select: text; }
  .mono { font: 12px "Courier New", monospace; color: var(--sub); }
  #fsx { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 10px; z-index: 30; opacity: .55; }
  body.full .top, body.full .bar, body.full #status { display: none; }
  body.phone .pad-only { display: none !important; }
  body:not(.phone) .pho { display: none !important; }
  body.phone .lg { display: none; }
  body.phone .top { padding: 8px 14px; }
  body.phone .bar { padding: 8px 14px 4px; gap: 5px; }
  body.phone .bar .b { padding: 0 9px; letter-spacing: .12em; }
  body.phone #status { padding: 2px 14px 6px; }
</style>
</head>
<body data-theme="dark">
<div id="app">
  <div class="top"><div class="title">PHOTO GRID</div><button class="b" data-cmd="theme">THEME</button></div>
  <div class="bar" id="bar">
    <span class="pad-only lbl">COLUMNS</span>
    <span class="pad-only step"><button data-cmd="cols-">-</button><i class="colsVal">2</i><button data-cmd="cols+">+</button></span>
    <span class="pad-only lbl">ROWS</span>
    <span class="pad-only step"><button data-cmd="rows-">-</button><i class="rowsVal">2</i><button data-cmd="rows+">+</button></span>
    <button class="b" data-cmd="add">ADD</button>
    <button class="b" data-cmd="shuffle" id="bShuffle">SHUFFLE</button>
    <button class="b pad-only" data-cmd="full">FULL SCREEN</button>
    <button class="b pad-only" data-cmd="fit">FIT GRID</button>
    <button class="b pad-only" data-cmd="grid" id="bGrid">GRID: ON</button>
    <button class="b pri" data-cmd="export">EXPORT<span class="lg">&nbsp;PNG</span></button>
    <button class="b pad-only" data-cmd="clear" id="bClear">CLEAR</button>
    <button class="b pho" data-cmd="more">MORE</button>
  </div>
  <div id="status">Tap ADD to choose photos.</div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="sbar" hidden><span id="sinfo"></span><button class="b" data-cmd="sreset">RESET</button><button class="b" data-cmd="sdone">DONE</button></div>
    <div id="pop" hidden>
      <div class="pcol acts"><div class="ph">TILE</div>
        <button class="b" data-act="rl">ROTATE LEFT</button>
        <button class="b" data-act="rr">ROTATE RIGHT</button>
        <button class="b" data-act="r180">ROTATE 180</button>
      </div>
      <div class="pcol acts2"><div class="ph">&nbsp;</div>
        <button class="b" data-act="mh">MIRROR L-R</button>
        <button class="b" data-act="mv">MIRROR T-B</button>
        <button class="b" data-act="dup">DUPLICATE</button>
        <button class="b" data-act="stretch">STRETCH</button>
      </div>
      <div class="pcol"><div class="ph">ALIGN IN CELL</div>
        <div class="apad" id="apad"></div>
      </div>
      <div class="pcol"><div class="ph">&nbsp;</div>
        <button class="b err" data-act="rm">REMOVE</button>
        <button class="b" data-act="auto">AUTO</button>
      </div>
    </div>
  </div>
</div>

<button class="b" id="fsx" data-cmd="exitfull" hidden>EXIT</button>
<div id="loupe" hidden><canvas id="loupeCv" width="120" height="120"></canvas><span id="loupeHex"></span></div>

<div id="shufopt" hidden><div class="card">
  <div class="title" style="margin-bottom:2px">SHUFFLE OPTIONS</div>
  <label><input type="checkbox" id="optRot"> RANDOM ROTATION</label>
  <label><input type="checkbox" id="optMir"> RANDOM MIRROR</label>
  <div class="mono">Tap SHUFFLE to apply. Hold SHUFFLE to open this.</div>
  <div class="row"><button class="b" data-cmd="shufclose">CLOSE</button></div>
</div></div>

<div id="sheet" hidden><div class="card">
  <div class="row"><span class="lbl">COLUMNS</span><span class="step"><button data-cmd="cols-">-</button><i class="colsVal">2</i><button data-cmd="cols+">+</button></span></div>
  <div class="row"><span class="lbl">ROWS</span><span class="step"><button data-cmd="rows-">-</button><i class="rowsVal">2</i><button data-cmd="rows+">+</button></span></div>
  <div class="row"><button class="b" data-cmd="full">FULL SCREEN</button><button class="b" data-cmd="fit">FIT GRID</button><button class="b" data-cmd="grid" id="bGrid2">GRID: ON</button></div>
  <div class="row"><span class="lbl">BACKGROUND</span><input type="color" id="bgsw" value="#000000" aria-label="Background color"><input class="nm" id="bghex" type="text" placeholder="THEME" maxlength="7" autocapitalize="off" autocomplete="off" spellcheck="false" style="max-width:110px"></div>
  <div class="row"><button class="b" data-cmd="pick">PICK FROM PHOTO</button><button class="b" data-cmd="bgreset">RESET</button></div>
  <div class="row"><button class="b err" data-cmd="clear" id="bClear2">CLEAR</button><button class="b" data-cmd="closesheet">CLOSE</button></div>
  <div class="mono">Up to 6 x 6 on iPhone.</div>
</div></div>

<div id="exp" hidden><div class="card">
  <div class="title" style="margin-bottom:2px">EXPORT</div>
  <img id="expimg" alt="Exported grid">
  <div class="mono" id="expinfo"></div>
  <div class="row"><span class="lbl">NAME</span><input class="nm" id="expname" type="text" value="PhotoGrid" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
  <div class="row"><span class="lbl">NEXT NO.</span><input class="nm" id="expnum" type="text" inputmode="numeric" pattern="[0-9]*" value="1" autocomplete="off" style="max-width:120px"></div>
  <div class="row"><span class="lbl">FORMAT</span><button class="b on" id="fmtPng" data-cmd="fmt-png">PNG</button><button class="b" id="fmtJpg" data-cmd="fmt-jpg">JPEG</button></div>
  <div class="mono" id="expnext"></div>
  <div class="row"><button class="b pri" id="expShare" data-cmd="share">SHARE / SAVE</button><button class="b" data-cmd="copy">COPY</button><button class="b" data-cmd="expclose">CLOSE</button></div>
  <div class="mono">Tip: press and hold the picture, then choose Save to Photos.</div>
</div></div>

<input type="file" id="file" accept="image/*" multiple hidden>

<script>
(function () {
'use strict';
/* ------------------------------------------------------------------ setup */
var PHONE = Math.min(screen.width, screen.height) < 600;
var MIN_N = 1, MAX_N = PHONE ? 6 : 12, UNDO_LIMIT = 40, EXPORT_PX = 16000000;   /* iOS Safari canvas limit is 16,777,216 px */
var $ = function (id) { return document.getElementById(id); };
if (PHONE) document.body.classList.add('phone');
var cv = $('cv'), ctx = cv.getContext('2d');

var S = {
  cols: 2, rows: 2, slots: [null, null, null, null], reg: {}, nextId: 1, undo: [],
  sel: new Set(), selMode: true, redo: [], showGrid: true, popId: null, full: false, busy: false,
  drag: null, press: null, lastTap: 0, lastTapAt: 0, lastTapId: null, lastToggled: false,
  bgCustom: null, picking: false, pickDown: null, stretch: null, sdrag: null     /* custom background color (#rrggbb) - never saved, every launch starts on the theme */
};
var L = null, dpr = 1, cssW = 0, cssH = 0, dirty = false, clearTimer = 0, expBlob = null, expUrl = '', expCanvas = null, expFmt = 'png', expDims = null;

/* --------------------------------------------------------- pure layout logic */
function median(a) {
  var s = a.slice().sort(function (x, y) { return x - y; }), n = s.length;
  return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
}
function sum(a) { var t = 0; for (var i = 0; i < a.length; i++) t += a[i]; return t; }

/* A column is as wide as its widest image, a row as tall as its tallest. Empty
   columns and rows keep the median image size so their space stays open. */
function gridMetrics(sizes, cols, rows) {
  var pw = 1000, ph = 1000, i, present = [];
  for (i = 0; i < sizes.length; i++) if (sizes[i]) present.push(sizes[i]);
  if (present.length) {
    pw = median(present.map(function (s) { return s[0]; }));
    ph = median(present.map(function (s) { return s[1]; }));
  }
  var cw = [], rh = [];
  for (i = 0; i < cols; i++) cw.push(0);
  for (i = 0; i < rows; i++) rh.push(0);
  for (i = 0; i < sizes.length; i++) {
    var sz = sizes[i]; if (!sz) continue;
    var r = Math.floor(i / cols), c = i % cols;
    if (sz[0] > cw[c]) cw[c] = sz[0];
    if (sz[1] > rh[r]) rh[r] = sz[1];
  }
  return { colW: cw.map(function (w) { return w > 0 ? w : pw; }), rowH: rh.map(function (h) { return h > 0 ? h : ph; }) };
}

/* Cells and image rectangles. Every image keeps its own proportions; all share
   one scale. Each image is anchored toward the centre of the grid unless it has
   its own alignment (ax: -1 left, 0 centre, 1 right; ay: -1 top, 0 middle, 1 bottom). */
function computeLayout(sizes, cols, rows, scale, ox, oy, aligns) {
  var gm = gridMetrics(sizes, cols, rows), xs = [ox], ys = [oy], i;
  for (i = 0; i < gm.colW.length; i++) xs.push(xs[i] + gm.colW[i] * scale);
  for (i = 0; i < gm.rowH.length; i++) ys.push(ys[i] + gm.rowH[i] * scale);
  var cmid = (cols - 1) / 2, rmid = (rows - 1) / 2, cells = [], rects = [];
  for (i = 0; i < sizes.length; i++) {
    var s = sizes[i], r = Math.floor(i / cols), c = i % cols;
    var cx = xs[c], cy = ys[r], cw = xs[c + 1] - xs[c], ch = ys[r + 1] - ys[r];
    cells.push([cx, cy, cw, ch]);
    if (!s) { rects.push(null); continue; }
    var dw = Math.max(1, Math.round(s[0] * scale)), dh = Math.max(1, Math.round(s[1] * scale));
    var al = aligns ? aligns[i] : null, ax = al ? al[0] : null, ay = al ? al[1] : null, x, y;
    if (ax == null) x = c < cmid ? cx + cw - dw : (c > cmid ? cx : cx + (cw - dw) / 2);
    else x = ax < 0 ? cx : (ax > 0 ? cx + cw - dw : cx + (cw - dw) / 2);
    if (ay == null) y = r < rmid ? cy + ch - dh : (r > rmid ? cy : cy + (ch - dh) / 2);
    else y = ay < 0 ? cy : (ay > 0 ? cy + ch - dh : cy + (ch - dh) / 2);
    rects.push([Math.round(x), Math.round(y), dw, dh]);
  }
  return { cells: cells, rects: rects };
}

function reshapeSlots(slots, cols, rows, ncols, nrows) {
  var n = [], over = [], i;
  for (i = 0; i < ncols * nrows; i++) n.push(null);
  for (i = 0; i < slots.length; i++) {
    if (slots[i] === null) continue;
    var r = Math.floor(i / cols), c = i % cols;
    if (r < nrows && c < ncols) n[r * ncols + c] = slots[i]; else over.push(slots[i]);
  }
  for (i = 0; i < over.length; i++) {
    var j = n.indexOf(null);
    if (j < 0) return null;
    n[j] = over[i];
  }
  return n;
}

/* Drop image id on slot tgt. Empty target: it stays. Occupied: only that row
   moves, toward the nearest empty slot (a tie goes right); a full row gets a new
   column. Returns null if the row is full at the maximum width. */
function planDrop(slots, cols, rows, src, tgt, id) {
  var s = slots.slice();
  if (src !== null) s[src] = null;
  if (s[tgt] === null) { s[tgt] = id; return { slots: s, cols: cols, dir: null }; }
  var r = Math.floor(tgt / cols), tc = tgt % cols, empties = [], c, i;
  for (c = 0; c < cols; c++) if (s[r * cols + c] === null) empties.push(c);
  if (!empties.length) {
    if (cols >= MAX_N) return null;
    s = reshapeSlots(s, cols, rows, cols + 1, rows); cols += 1;
    for (c = 0; c < cols; c++) if (s[r * cols + c] === null) empties.push(c);
  }
  var base = r * cols, e = empties[0], best = null;
  empties.forEach(function (cc) {
    var key = [Math.abs(cc - tc), cc > tc ? 0 : 1];
    if (!best || key[0] < best[0] || (key[0] === best[0] && key[1] < best[1])) { best = key; e = cc; }
  });
  var dir;
  if (e > tc) { for (i = e; i > tc; i--) s[base + i] = s[base + i - 1]; dir = 'right'; }
  else { for (i = e; i < tc; i++) s[base + i] = s[base + i + 1]; dir = 'left'; }
  s[base + tc] = id;
  return { slots: s, cols: cols, dir: dir };
}

/* Move the picked slots by dr rows and dc columns as one block. The grid grows
   (up to the maximum) if the block needs it. Refused if a tile would land on a
   tile that is not picked, or leave the grid at the top or left. */
function planGroupMove(slots, cols, rows, picked, dr, dc) {
  var moves = [], i;
  picked.slice().sort(function (a, b) { return a - b; }).forEach(function (k) {
    moves.push([Math.floor(k / cols) + dr, (k % cols) + dc, slots[k], k]);
  });
  var minr = 1e9, minc = 1e9, maxr = -1, maxc = -1;
  moves.forEach(function (m) { minr = Math.min(minr, m[0]); minc = Math.min(minc, m[1]); maxr = Math.max(maxr, m[0]); maxc = Math.max(maxc, m[1]); });
  if (minr < 0 || minc < 0) return { err: 'Refused - the group would go off the top or left edge.' };
  var ncols = Math.max(cols, maxc + 1), nrows = Math.max(rows, maxr + 1);
  if (ncols > MAX_N || nrows > MAX_N) return { err: 'Refused - the group would not fit in ' + MAX_N + ' x ' + MAX_N + '.' };
  var s = reshapeSlots(slots, cols, rows, ncols, nrows);
  moves.forEach(function (m) { s[Math.floor(m[3] / cols) * ncols + (m[3] % cols)] = null; });
  for (i = 0; i < moves.length; i++) if (s[moves[i][0] * ncols + moves[i][1]] !== null) return { err: 'Refused - the group would land on a tile that is not selected.' };
  moves.forEach(function (m) { s[m[0] * ncols + m[1]] = m[2]; });
  return { slots: s, cols: ncols, rows: nrows };
}

/* ----------------------------------------------------------------- helpers */
function count() { var n = 0; S.slots.forEach(function (v) { if (v !== null) n++; }); return n; }
function effSize(info) { var sx = info.sx || 1, sy = info.sy || 1; return info.rot % 180 ? [info.h * sx, info.w * sy] : [info.w * sx, info.h * sy]; }   /* stretch is in screen directions, after rotation */
function status(t, err) { var el = $('status'); el.textContent = t; el.className = err ? 'err' : ''; }
var cssCache = {};
function cssVar(n) {
  var k = document.body.getAttribute('data-theme') + n;
  if (!cssCache[k]) cssCache[k] = getComputedStyle(document.body).getPropertyValue(n).trim();
  return cssCache[k];
}
function gridCol() { return dark() ? cssVar('--label') : cssVar('--handle'); }   /* light theme: the Image Corrector's orange; dark theme unchanged */
function accentCol() { return dark() ? cssVar('--text') : cssVar('--handle'); }   /* selection outline: orange in the light theme */
function dark() { return document.body.getAttribute('data-theme') === 'dark'; }
function mk(w, h) { var c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; }
function release(c) { c.width = 1; c.height = 1; }

/* Draw one tile: rotate first, then mirror the result, so MIRROR always flips
